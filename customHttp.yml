# Security headers for AWS Amplify Hosting (it reads this file from the repo root).
# connect-src allows the contact form to reach its form service (api.web3forms.com) and nothing else.
customHeaders:
  - pattern: '**'
    headers:
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self' https://api.web3forms.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
